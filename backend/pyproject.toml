[project]
name = "migration-oracle-backend"
version = "0.1.0"
description = "Migration Oracle control plane API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlalchemy-cockroachdb>=2.0.2",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "sqlglot>=26.0.0",
    "PyYAML>=6.0.0",
    "sse-starlette>=2.1.0",
    "mcp>=2.0.0",
    # Declared explicitly, not left to transitive resolution through `mcp`.
    # `app/auth/clerk.py` imports `jwt` at module level and the Slack/GitHub
    # OAuth services import `cryptography.fernet`; if a future resolver picks a
    # dependency set without them, Clerk auth fails *silently* — the middleware
    # catches the ImportError in a broad `except Exception` and returns 401 on
    # every request rather than surfacing the missing module.
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
