            - paragraph [ref=f21e275]: This change is safe to run and is expected to complete quickly on the shadow cluster. It works by scanning every existing row in the users table to build a new searchable structure for the username column, which takes a short but non-zero amount of time proportional to the 100,000 rows present. The uniqueness requirement means the build will fail if any two rows share the same username value, so duplicate data is the one thing that could cause this to error out rather than succeed. A closely matched past synthetic run on the same scale tier measured about 14.5 seconds, which gives reasonable confidence in the estimate here.
            - generic [ref=f21e276]:
              - paragraph [ref=f21e277]: Recommendation
              - paragraph [ref=f21e278]: Apply the unique index directly during a low-traffic window, monitoring the backfill job as it runs.
              - paragraph [ref=f21e279]: This migration is straightforward and policy allows it, but the uniqueness constraint is the one thing that can cause a hard failure rather than a slow one. If any two users share a username today, the entire index build will be rejected instantly and no index will be created. The backfill itself is fast and CockroachDB handles it online, so the main preparation work is a duplicate-data audit before you run anything. Running off-peak is still worthwhile because the backfill competes for I/O, and actively watching the job status prevents you from assuming success when the build may have silently failed and left an invalid index behind.
            - button "Show details" [ref=f21e281]
