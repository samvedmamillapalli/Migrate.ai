AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Migration Oracle execution plane (us-east-1): artifact bucket, seven workflow
  Lambdas (ZIP, ccloud_api REST provision), orphan sweeper schedule, and Step
  Functions state machine with ASL DefinitionSubstitutions.

Parameters:
  ProjectName:
    Type: String
    Default: migration-oracle
  EnvironmentName:
    Type: String
    Default: demo
    AllowedValues: [development, demo, staging, production]
  ArtifactsBucketName:
    Type: String
    Default: ""
    Description: Leave empty to auto-name ${ProjectName}-artifacts-${AccountId}
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: CockroachDB control-plane DATABASE_URL (postgresql://...)
  CCloudApiSecret:
    Type: String
    NoEcho: true
    Description: CockroachDB Cloud service-account secret (Bearer token for ccloud_api)
  CCloudApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional CockroachDB Cloud API key id (metadata only)
  CCloudApiKeySecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN holding CCLOUD credentials (read access only)
  UserDatabaseSecretPrefix:
    Type: String
    Default: migration-oracle/connections
  BedrockPredictionModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  BedrockRecommendationModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  BedrockEmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Titan embed model id — must match BEDROCK_EMBEDDING_MODEL_ID in .env
  SweeperScheduleExpression:
    Type: String
    Default: rate(15 minutes)

Conditions:
  HasBucketName: !Not [!Equals [!Ref ArtifactsBucketName, ""]]
  HasCCloudSecretArn: !Not [!Equals [!Ref CCloudApiKeySecretArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 300
    Environment:
      Variables:
        AWS_ENABLED: "true"
        ENVIRONMENT: !Ref EnvironmentName
        DATABASE_URL: !Ref DatabaseUrl
        RUN_ARTIFACTS_BUCKET: !Ref RunArtifactsBucket
        SHADOW_PROVIDER: ccloud_api
        CCLOUD_API_SECRET: !Ref CCloudApiSecret
        CCLOUD_API_KEY: !Ref CCloudApiKey
        CCLOUD_API_KEY_SECRET_ARN: !Ref CCloudApiKeySecretArn
        USER_DATABASE_SECRET_PREFIX: !Ref UserDatabaseSecretPrefix
        BEDROCK_PREDICTION_MODEL_ID: !Ref BedrockPredictionModelId
        BEDROCK_RECOMMENDATION_MODEL_ID: !Ref BedrockRecommendationModelId
        BEDROCK_EMBEDDING_MODEL_ID: !Ref BedrockEmbeddingModelId
        BEDROCK_REGION: us-east-1
        AWS_CLOUDWATCH_NAMESPACE: MigrationOracle
        AWS_LAMBDA_FUNCTION_PREFIX: !Ref ProjectName
        SHADOW_APP_TAG: !Ref ProjectName
        SHADOW_CLUSTER_CLOUD: aws
        SHADOW_CLUSTER_REGION: us-east-1

Resources:
  RunArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - HasBucketName
        - !Ref ArtifactsBucketName
        - !Sub "${ProjectName}-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---- Shared secret/S3 ARN helpers (inline policy fragments via roles) ----

  DiscoverSchemaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-discover-schema"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.discover_schema.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:AbortMultipartUpload
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}"
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${UserDatabaseSecretPrefix}*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:migration-oracle/connections*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  ProvisionShadowClusterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-provision-shadow-cluster"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.provision_shadow.handler
      Timeout: 900
      MemorySize: 1024
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}"
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
                - secretsmanager:UpdateSecret
                - secretsmanager:TagResource
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:migration-oracle/shadow*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${UserDatabaseSecretPrefix}*"
                - !If
                  - HasCCloudSecretArn
                  - !Ref CCloudApiKeySecretArn
                  - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  LoadSchemaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-load-schema"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.load_schema.handler
      Timeout: 600
      MemorySize: 1024
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}"
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:migration-oracle/shadow*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  ExecuteMigrationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-execute-migration"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.execute_migration.handler
      Timeout: 900
      MemorySize: 1024
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}"
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:migration-oracle/shadow*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  CollectMetricsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-collect-metrics"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.collect_metrics.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}"
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:migration-oracle/shadow*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  PersistResultsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-persist-results"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.persist_results.handler
      Timeout: 180
      MemorySize: 1024
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}"
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/*"
                - !Sub "arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  CleanupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-cleanup"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.cleanup.handler
      Timeout: 600
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}"
                - !Sub "arn:aws:s3:::${RunArtifactsBucket}/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
                - secretsmanager:DeleteSecret
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:migration-oracle/shadow*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  ShadowSweeperFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${ProjectName}-shadow-sweeper"
      CodeUri: lambda_src/
      Handler: app.lambdas.handlers.sweep_orphans.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !If
                - HasCCloudSecretArn
                - - !Ref CCloudApiKeySecretArn
                - - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:migration-oracle/*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: MigrationOracle
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref SweeperScheduleExpression
            Description: Reap orphaned CockroachDB Cloud shadow clusters

  MigrationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${ProjectName}-migration-workflow"
      Type: STANDARD
      DefinitionUri: ../stepfunctions/migration_workflow.asl.json
      DefinitionSubstitutions:
        DiscoverSchemaFunctionArn: !GetAtt DiscoverSchemaFunction.Arn
        ProvisionShadowClusterFunctionArn: !GetAtt ProvisionShadowClusterFunction.Arn
        LoadSchemaFunctionArn: !GetAtt LoadSchemaFunction.Arn
        ExecuteMigrationFunctionArn: !GetAtt ExecuteMigrationFunction.Arn
        CollectMetricsFunctionArn: !GetAtt CollectMetricsFunction.Arn
        PersistResultsFunctionArn: !GetAtt PersistResultsFunction.Arn
        CleanupFunctionArn: !GetAtt CleanupFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DiscoverSchemaFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ProvisionShadowClusterFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref LoadSchemaFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ExecuteMigrationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CollectMetricsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PersistResultsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CleanupFunction

Outputs:
  MigrationWorkflowArn:
    Description: Set as MIGRATION_WORKFLOW_ARN on the FastAPI control plane
    Value: !Ref MigrationStateMachine
  ArtifactsBucket:
    Description: Set as RUN_ARTIFACTS_BUCKET
    Value: !Ref RunArtifactsBucket
  DiscoverSchemaFunctionArn:
    Description: Optional AWS_LAMBDA_DISCOVER_SCHEMA_ARN
    Value: !GetAtt DiscoverSchemaFunction.Arn
  ProvisionShadowClusterFunctionArn:
    Description: Optional AWS_LAMBDA_PROVISION_SHADOW_CLUSTER_ARN
    Value: !GetAtt ProvisionShadowClusterFunction.Arn
  LoadSchemaFunctionArn:
    Description: Optional AWS_LAMBDA_LOAD_SCHEMA_ARN
    Value: !GetAtt LoadSchemaFunction.Arn
  ExecuteMigrationFunctionArn:
    Description: Optional AWS_LAMBDA_EXECUTE_MIGRATION_ARN
    Value: !GetAtt ExecuteMigrationFunction.Arn
  CollectMetricsFunctionArn:
    Description: Optional AWS_LAMBDA_COLLECT_METRICS_ARN
    Value: !GetAtt CollectMetricsFunction.Arn
  PersistResultsFunctionArn:
    Description: Optional AWS_LAMBDA_PERSIST_RESULTS_ARN
    Value: !GetAtt PersistResultsFunction.Arn
  CleanupFunctionArn:
    Description: Optional AWS_LAMBDA_CLEANUP_ARN
    Value: !GetAtt CleanupFunction.Arn
  SweeperFunctionArn:
    Description: EventBridge-scheduled orphan sweeper
    Value: !GetAtt ShadowSweeperFunction.Arn
  StackRegion:
    Description: Must stay us-east-1 for Bedrock + shadow region defaults
    Value: !Ref AWS::Region
