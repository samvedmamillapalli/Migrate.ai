name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Import smoke (closed-loop surface)
        run: |
          python -c "from app.main import create_app; app = create_app(); print('app_ok', len(app.routes))"

      # Full Phase 9/10 verifies need DATABASE_URL (CockroachDB). Run when secret is set.
      - name: Phase 9 mock verify
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ENABLED: "false"
          ENVIRONMENT: test
        run: python scripts/verify_phase9_ai_prediction.py

      - name: Phase 10 mock verify
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ENABLED: "false"
          ENVIRONMENT: test
        run: python scripts/verify_phase10_grading_memory.py
